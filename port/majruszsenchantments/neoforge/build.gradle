plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}

base {
    archivesName = "${mod_archives_name}-neoforge-${minecraft_version}-${mod_version}"
}

repositories {
    maven { name = 'CurseMaven'; url = 'https://www.cursemaven.com' }
    flatDir { dirs 'libs' }
}

def commonSrcDir = "${project.buildDir}/classes/generated/main"
def changelogText = rootProject.file('changelog.md').text

project.delete(fileTree(dir: commonSrcDir))

project(':common') {
    task replaceNeoForgeAnnotations(type: Copy) {
        from 'src/main/java'
        into commonSrcDir
        duplicatesStrategy = DuplicatesStrategy.INCLUDE

        filter {
            String line ->  line.replaceAll('com.majruszlibrary.annotation.Dist', 'net.neoforged.api.distmarker.Dist')
                    .replaceAll('com.majruszlibrary.annotation.OnlyIn', 'net.neoforged.api.distmarker.OnlyIn')
        }
    }

    tasks.withType(JavaCompile) {
        dependsOn replaceNeoForgeAnnotations
    }
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }

        client { client() }
        client2 { client(); programArguments.addAll '--username', 'Dev2' }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(':common')
    // Library JAR provided via run/mods folder at runtime
    compileOnly files(rootProject.file('libs/majrusz-library-neoforge-1.21.1-7.0.8.jar'))
}

// Ensure sourceSets.main.output includes our compiled classes
sourceSets.main.output.classesDirs.from(file("${project.buildDir}/classes/java/main"))

tasks.withType(JavaCompile).configureEach {
    options.setEncoding('UTF-8')
    options.release.set(21)
}

tasks.named('compileJava', JavaCompile) {
    source(commonSrcDir)
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'FMLModType': 'MOD',
            'MixinConfigs': "${mod_id}-common.mixins.json,${mod_id}-neoforge.mixins.json,majruszlibrary-common.mixins.json,majruszlibrary-neoforge.mixins.json"
        ])
    }
}

// Majrusz Library'yi mod jar'inin ICINE gom (ayri jar gerektirmez)
tasks.named('jar', Jar) {
    from(zipTree(rootProject.file('libs/majrusz-library-neoforge-1.21.1-7.0.8.jar'))) {
        exclude 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'META-INF/MANIFEST.MF'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    from project(':common').sourceSets.main.resources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand project.properties
    }
    // NeoForge 1.21.1 requires neoforge.mods.toml
    rename 'mods.toml', 'neoforge.mods.toml'
    outputs.upToDateWhen { false }
}

// Ensure FML metadata is in the class output directory for dev runtime
tasks.register('copyModMetadata') {
    dependsOn 'processResources', 'compileJava'
    doLast {
        def metaDir = file("${project.buildDir}/classes/java/main/META-INF")
        metaDir.mkdirs()
        file("${project.buildDir}/classes/java/main/META-INF/MANIFEST.MF").text = "Manifest-Version: 1.0\nFMLModType: MOD\nMixinConfigs: ${mod_id}-common.mixins.json,${mod_id}-neoforge.mixins.json,majruszlibrary-common.mixins.json,majruszlibrary-neoforge.mixins.json\n"
        copy {
            from "${project.buildDir}/resources/main/META-INF"
            into "${project.buildDir}/classes/java/main/META-INF"
            include 'mods.toml'
        }
    }
}
tasks.named('classes').configure {
    dependsOn 'copyModMetadata'
}

modrinth {
    token.set(System.getenv('MODRINTH_TOKEN'))
    projectId.set(modrinth_project_id)
    changelog.set(changelogText)
    versionNumber.set(mod_version)
    versionName.set("${mod_display_name} ${mod_version}")
    versionType.set('release')
    uploadFile.set(file("build/libs/${mod_archives_name}-neoforge-${minecraft_version}-${mod_version}.jar"))
    gameVersions.set([minecraft_version])
    loaders.set(['neoforge'])
    dependencies { required.project('majrusz-library') }
}

task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn 'build'
    group = 'publishing'
    apiToken = System.getenv('CURSEFORGE_TOKEN')
    def file = upload(curseforge_project_id, file("build/libs/${mod_archives_name}-neoforge-${minecraft_version}-${mod_version}.jar"))
    file.displayName = "${mod_display_name} ${mod_version} (NeoForge)"
    file.changelog = changelogText
    file.changelogType = 'markdown'
    file.addModLoader('NeoForge')
    file.addGameVersion(minecraft_version)
    file.addGameVersion('Client', 'Server')
    file.addJavaVersion('Java 21')
    file.releaseType = 'release'
    file.addRequirement('majrusz-library')
}

tasks.register('publishMods') {
    group = 'publishing'
    if( !mod_version.contains('unfinished') ) {
        dependsOn tasks.named('modrinth')
        dependsOn tasks.named('curseforge')
    } else {
        logger.error('Tried to publish unfinished mod')
    }
}

// Debug: print source set output
tasks.register('showSourceSetOutput') {
    doLast {
        println "=== Main sourceSet output ==="
        sourceSets.main.output.classesDirs.each { println it }
        println "=== Main sourceSet all sources ==="
        sourceSets.main.allSource.srcDirs.each { println it }
        println "=== Common sourceSet output ==="
        project(':common').sourceSets.main.output.classesDirs.each { println it }
    }
}
