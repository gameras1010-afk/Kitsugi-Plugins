# ============================================================
#  Lithium Config — 1.21.1 NeoForge
#  Konum: <sunucu>/config/lithium.properties
# ============================================================
#
#  !!! ONCE BUNU OKU !!!
#
#  MOONRISE'I SILDIN. BU IYI BIR SEY.
#
#  Moonrise kuruluyken Lithium'un su kisimlari ZORLA kapaliydi:
#    - collision optimizasyonlari
#    - entity tracker
#    - random ticking
#    - chunk erisim hot path'leri
#  Cunku Moonrise ayni yerlere kendi kodunu koyuyordu.
#
#  Moonrise gidince bu baski kalkti. Lithium artik TAM
#  KAPASITE calisiyor. Moonrise'in yaptigi collision /
#  entity tracker / random tick islerinin buyuk kismini
#  simdi Lithium ustleniyor. Ekstra bir sey yapmana gerek yok.
#
#  C2ME ile Lithium resmi olarak uyumlu — C2ME'nin kendi
#  dokumantasyonu "best performance icin Lithium ve
#  ScalableLux ile birlikte kullanin" diyor. Ayni gelistirici
#  (ishland) her ucunde de calisiyor.
#
#  Bu dosyayi bos birakmak (veya hic olusturmamak) en iyi secenek.
#  Lithium varsayilanlari zaten optimaldir.
#
#  Bu dosya sadece SORUN CIKARSA kullanilacak bir referans.
#  Asagidaki satirlarin HEPSI yorumda. Sadece ihtiyacin olani ac.
#
# ============================================================


# ------------------------------------------------------------
#  SORUN GIDERME — Sadece belirti gorursen ac
# ------------------------------------------------------------

# Belirti: Mob'lar garip davraniyor, spawn olmuyor, donuyor
# mixin.ai=false

# Belirti: Mob'lar duvarlardan geciyor / yanlis yol buluyor
# mixin.ai.pathing=false

# Belirti: Hopper/sandik item aktarmiyor veya item kayboluyor
# mixin.block.hopper=false

# Belirti: Redstone davranisi bozuk
#   (Alternate Current kurduysan ZATEN bunu kapatman gerekebilir)
# mixin.world.block_entity_ticking=false

# Belirti: Entity'ler birbirinin icine giriyor / collision bozuk
#   NOT: Moonrise gittigi icin bu ARTIK AKTIF calisiyor.
#   Moonrise'in collision isini simdi bu ustleniyor. Kapatma.
# mixin.entity.collisions=false

# Belirti: Chunk yukleme sirasinda crash / ArrayIndexOutOfBounds
#   NOT: C2ME de chunk sistemine dokunuyor. Once C2ME'yi
#   sucla, Lithium'u degil. Bu ikisi resmen uyumlu ama
#   crash goruyorsan once c2me.toml'da threadedWorldGen'i
#   kapatip test et.
# mixin.world.chunk_access=false
# mixin.world.chunk_tickets=false

# Belirti: Explosion (TNT/creeper) sirasinda desync veya crash
# mixin.world.explosions=false

# Belirti: Mob spawn oranlari acayip (cok az veya cok fazla)
# mixin.world.mob_spawning=false

# Belirti: Tarim/bitki buyume hizi yanlis
# mixin.world.tick_scheduler=false


# ------------------------------------------------------------
#  Nukleer secenek — Lithium'u tamamen kapatir
# ------------------------------------------------------------
# mixin=false


