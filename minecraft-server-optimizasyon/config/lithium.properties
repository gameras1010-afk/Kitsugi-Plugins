# ------------------------------------------------------------
#  SORUN GIDERME — Sadece belirti gorursen ac
# ------------------------------------------------------------

# Belirti: Mob'lar garip davraniyor, spawn olmuyor, donuyor
# mixin.ai=false

# Belirti: Mob'lar duvarlardan geciyor / yanlis yol buluyor
# mixin.ai.pathing=false

# Belirti: Hopper/sandik item aktarmiyor veya item kayboluyor
# mixin.block.hopper=false

# Belirti: Redstone davranisi bozuk
#   (Alternate Current kurduysan ZATEN bunu kapatman gerekebilir)
# mixin.world.block_entity_ticking=false

# Belirti: Entity'ler birbirinin icine giriyor / collision bozuk
#   NOT: Moonrise collision'i kendi devraliyor, bu zaten kapali olabilir
# mixin.entity.collisions=false

# Belirti: Chunk yukleme sirasinda crash / ArrayIndexOutOfBounds
# mixin.world.chunk_access=false
# mixin.world.chunk_tickets=false

# Belirti: Explosion (TNT/creeper) sirasinda desync veya crash
# mixin.world.explosions=false

# Belirti: Mob spawn oranlari acayip (cok az veya cok fazla)
# mixin.world.mob_spawning=false

# Belirti: Tarim/bitki buyume hizi yanlis
# mixin.world.tick_scheduler=false


# ------------------------------------------------------------
#  Nukleer secenek — Lithium'u tamamen kapatir
# ------------------------------------------------------------
# mixin=false


