# ============================================================
#  Moonrise Config — i5-9400F / 16GB / NVMe / Ubuntu 24.04
#  Minecraft 1.21.1 NeoForge
#
#  Konum: <sunucu>/config/moonrise.yml
#
#  Bu dosya SENIN donanimina gore hesaplandi:
#    CPU  : Intel i5-9400F, 6 cekirdek / 6 THREAD (SMT/HT YOK)
#    RAM  : 16 GB DDR4-2667
#    Disk : Kioxia Exceria NVMe (nvme0n1)
#    OS   : Ubuntu 24.04 LTS
#
#  Semasi Moonrise'in MoonriseConfig.java (mc/1.21.1) kaynagindan.
# ============================================================

chunk-loading:

  basic:
    # Limitsiz. NVMe + tek/az oyuncu senaryosunda dogru secim.
    player-max-send-rate: -1.0
    player-max-load-rate: -1.0

    # !!! DIKKAT — SENIN ICIN ONEMLI !!!
    # 6 THREAD'in var. Limitsiz birakirsan yeni araziye ucan
    # tek bir oyuncu tum worker thread'leri kilitler ve
    # sunucunun geri kalani (mob, redstone, tick) durur.
    #
    # SMT olmadigi icin bu risk 12-thread'lik bir CPU'ya gore
    # cok daha yuksek. Bu yuzden limit koyuyoruz.
    #
    #   Tek kisi oynuyorsan     -> 8.0
    #   2-5 kisi                -> 5.0  (asagidaki deger)
    #   5+ kisi                 -> 3.0
    player-max-gen-rate: 5.0

    # 0t = aninda bosalt. 16GB'in var ama 8G'i heap'e verdik,
    # geri kalani OS page cache icin lazim. Gecikme ekleme.
    player-chunk-unload-delay: 0t

  advanced:
    # Sunucu zorlandiginda view-distance'i otomatik dusurur.
    # 6 thread'lik CPU'da bu bir can simidi. Kesinlikle true.
    auto-config-send-distance: true

    # 0 = otomatik. NVMe'de otomatik yeterli, elleme.
    player-max-concurrent-chunk-loads: 0

    # 0 = otomatik. Modlu sunucuda elle buyutme.
    player-max-concurrent-chunk-generates: 0

chunk-saving:
  auto-save-interval: 5m

  # NVMe SSD -> 24. Kayit yuku daha kisa surede biter,
  # MSPT spike'i kisalir.
  max-auto-save-chunks-per-tick: 24

worker-pool:
  # ############################################################
  # ##  ASIL SORUN BURASIYDI. OKU.                            ##
  # ############################################################
  #
  # Moonrise'in VARSAYILAN formulu:  (cekirdek / 2) / 2
  # Senin CPU'nda:                   (6 / 2) / 2 = 1
  #
  # >>> Moonrise senin makinende chunk uretmek icin
  # >>> TEK BIR THREAD kullaniyordu. <<<
  #
  # C2ME ayni makinede 5-6 thread kullanir. "Moonrise yavas"
  # dedigin sey buydu — kod kalitesi degil, thread sayisi.
  #
  # ---- Thread butcesi (toplam 6, SMT yok) ----
  #   1  ana tick thread   (asla ac kalmamali, yoksa TPS duser)
  #   3  chunk worker      (asagidaki deger)
  #   2  GC + netty + OS + io
  #
  # 3 yaziyoruz cunku SMT yok. 6 thread'lik bir CPU'da
  # 12-thread'lik CPU gibi davranamazsin — her worker gercek
  # bir cekirdegi tamamen isgal eder.
  #
  # Bu tek satir sana varsayilana gore ~3x chunk hizi verir.
  worker-threads: 3
  #
  # ---- Ne zaman degistirirsin? ----
  #
  #   4 YAP :  Chunky ile pregen calistirirken (oyuncu yokken).
  #            Bitince 3'e geri al.
  #
  #   2 YAP :  Chunk hizli geliyor AMA oyun takiliyorsa
  #            (TPS dusuk, MSPT > 50). Ana thread ac kalmis
  #            demektir.
  #
  #   5+    :  YAPMA. Ana tick thread'i aclıktan olur.

  # Disk I/O thread'i.
  # NVMe oldugu icin 1'in ustune cikmak mantikli (Moonrise'in
  # kendi notu: >1 sadece SSD'de anlamli, HDD'de negatif olceklenir).
  #
  # Ama 6 thread'in var, 4 yazmak CPU'yu bogar. 2 dogru deger.
  # I/O thread'leri cogunlukla disk bekler, CPU yemez —
  # bu yuzden 3+2+1=6 olmasi sorun degil.
  io-threads: 2

chunk-system:
  # ############################################################
  # ##  SENIN DURUMUNDA BUNU ACABILIRSIN — sartli             ##
  # ############################################################
  #
  # Paralel population generation. Varsayilan false.
  #
  # Moonrise'in kendi kosulu: "sadece worldgen modu yoksa VE
  # population generation doyuyorsa (~10 worker thread surekli
  # chunk uretiyorsa)" acilmali.
  #
  # Sende 3 worker var, 10 degil. Yani teknik olarak Moonrise'in
  # onerdigi esikte degilsin. AMA 3 worker'in doydugu durumda
  # yine de kazanc verir.
  #
  # KARAR:
  #   Worldgen modun YOK  (BOP/Terralith/YUNG's/Repurposed yok)
  #      -> true yap, yedek al, 15 dk yeni arazide uc, kontrol et
  #   Worldgen modun VAR
  #      -> false birak. Bozuk chunk / kayip yapi riski.
  #
  # Emin degilsen false birak, once worker-threads=3'un
  # etkisini gor. Muhtemelen zaten yeterli gelecek.
  population-gen-parallelism: false

bug-fixes:
  # Lav bloklari random tick'te CIFT tick'leniyor (vanilla bug).
  # true = duzeltilir, world random ticking maliyeti belirgin duser.
  # 6 thread'lik CPU'da bu ciddi bir kazanc. Kesinlikle ac.
  fix-MC-224294: true

  # End adalarinin uzak mesafede duzgun uretilmemesi.
  # Zaten uretilmis alanlari etkilemez.
  fix-MC-159283: true

misc:
  # Client tarafi, dedicated server'da anlamsiz.
  immediately-close-loading-screen: false
